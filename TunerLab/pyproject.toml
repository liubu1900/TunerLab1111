[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "loadpull-tuner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "h5py", "PySide6", "PyVISA", "scikit-rf"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
tuner-ui = "tuner.ui:main"
tuner-demo = "tuner.demo:main"
[tool.setuptools.packages.find]
include = ["tuner*"]
