name: Desktop validation and Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      TUNERLAB_DATA_DIR: ${{ runner.temp }}/tunerlab-data
      APPDATA: ${{ runner.temp }}/tunerlab-appdata
      LOCALAPPDATA: ${{ runner.temp }}/tunerlab-localappdata
      PYTHONPATH: ${{ github.workspace }}/TunerLabApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r TunerLab/requirements-tested.txt -e './TunerLab[test]'
      - name: Test backend and desktop
        run: python -m pytest TunerLab/tests TunerLabApp/tests -q --junitxml=test-results.xml
      - name: Desktop startup check
        working-directory: TunerLabApp
        run: python -m tunerlab_app --smoke-test
      - name: Install Windows packager
        if: runner.os == 'Windows'
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: TunerLabApp
        run: python -m PyInstaller packaging/tunerlab.spec --noconfirm --clean
      - name: Check frozen application and create ZIP
        if: runner.os == 'Windows'
        working-directory: TunerLabApp
        shell: pwsh
        run: |
          $version = python -c "from tunerlab_app.version import __version__; print(__version__)"
          $process = Start-Process -FilePath dist/TunerLab/TunerLab.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Frozen smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen smoke test failed: $($process.ExitCode)" }
          Move-Item dist/TunerLab "dist/TunerLab-$version"
          Compress-Archive -Path "dist/TunerLab-$version" -DestinationPath "dist/TunerLab-$version-win64.zip"
          python packaging/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: TunerLab-windows
          path: TunerLabApp/dist/*-win64.zip
          retention-days: 14
